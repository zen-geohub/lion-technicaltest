services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fms_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan storage:link --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: fms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  backend_storage:
